<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Découvrir la mécanique des structures — séquence inductive</title>
<style>
  :root{
    --bg:#0e0e10; --panel:#161618; --panel-2:#1d1d20; --line:#2a2a2e;
    --ink:#ecebe6; --ink-dim:#9a988f; --ink-faint:#65645e;
    --accent:#e6a049; --accent-soft:#3a2c16;
    --cyan:#5fb9c4; --danger:#d06b5a; --ok:#7fb069;
    --radius:12px;
    --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;
    --sans:'Sora','Segoe UI',system-ui,-apple-system,sans-serif;
    --display:'Fraunces',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(900px 520px at 82% -12%, #1b1a17 0%, transparent 60%),
      radial-gradient(700px 420px at -8% 110%, #14161a 0%, transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--sans); font-weight:300;
    -webkit-font-smoothing:antialiased; padding:18px 20px 60px;
  }
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:#2c2c30;border-radius:8px}

  header{max-width:1100px;margin:0 auto 14px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{font-family:var(--display);font-weight:600;font-size:26px}
  header h1 .spark{color:var(--accent)}
  header .sub{color:var(--ink-dim);font-size:13px}
  header .badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent);
    border:1px solid var(--accent-soft);background:rgba(230,160,73,.06);padding:4px 10px;border-radius:999px}

  nav{max-width:1100px;margin:0 auto 8px;display:flex;gap:7px;flex-wrap:wrap}
  .tab{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
    border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;transition:all .18s;
    display:flex;align-items:center;gap:7px;font-family:var(--sans)}
  .tab:hover{color:var(--ink);border-color:var(--ink-faint)}
  .tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .tab .tick{color:var(--ok);display:none}
  .tab.done .tick{display:inline}
  .progress-wrap{max-width:1100px;margin:0 auto 18px;display:flex;align-items:center;gap:12px}
  .progress{flex:1;height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--accent-soft),var(--accent));width:0;transition:width .5s}
  .progress-txt{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);min-width:110px;text-align:right}

  main{max-width:1100px;margin:0 auto}
  .page{display:none;animation:fadeIn .3s}
  .page.on{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
  .card h2{font-family:var(--display);font-weight:500;font-size:18px;margin-bottom:8px}
  .card h3{font-family:var(--display);font-weight:500;font-size:15px;margin:14px 0 8px;color:var(--accent)}
  .card p{font-size:14px;line-height:1.75;color:var(--ink-dim);margin-bottom:8px}
  .card p b,.card li b{color:var(--ink);font-weight:500}
  .pill{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--cyan);
    border:1px solid rgba(95,185,196,.35);border-radius:999px;padding:2px 9px;margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase}
  .pill.amber{color:var(--accent);border-color:var(--accent-soft)}
  .reglages{font-family:var(--mono);font-size:12.5px;line-height:1.85;color:var(--ink-dim);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin:4px 0 10px}
  .reglages b{color:var(--accent);font-weight:600}

  ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px;margin:6px 0}
  ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    font-size:13.5px;line-height:1.6;color:var(--ink-dim);cursor:pointer;transition:all .2s}
  ol.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;color:var(--accent);
    border:1px solid var(--accent-soft);border-radius:50%;min-width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  ol.steps li.ck{border-color:rgba(127,176,105,.45);color:var(--ink-faint)}
  ol.steps li.ck::before{content:"✓";color:var(--ok);border-color:rgba(127,176,105,.45)}
  ol.steps li b{color:var(--ink)}
  ol.steps li.ck b{color:var(--ink-dim)}

  table.mes{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:13.5px}
  table.mes th{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-transform:uppercase;
    letter-spacing:.06em;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  table.mes td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-dim)}
  table.mes input{width:100px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);font-family:var(--mono);font-size:14px;padding:7px 10px;text-align:right;outline:none;transition:border .2s}
  table.mes input:focus{border-color:var(--accent)}
  table.mes input.good{border-color:var(--ok);color:var(--ok)}
  table.mes input.bad{border-color:var(--danger);color:var(--danger)}
  table.mes .unit{font-family:var(--mono);color:var(--ink-faint);font-size:12px;padding-left:6px}
  .mes-result{font-size:13px;margin-top:4px;min-height:20px}
  .mes-result.good{color:var(--ok)}
  .mes-result.bad{color:var(--danger)}

  .qcm{margin:10px 0}
  .qcm .q{font-size:14px;color:var(--ink);margin-bottom:8px;line-height:1.6}
  .qcm .opts{display:flex;flex-direction:column;gap:7px}
  .qcm button.opt{text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
    border-radius:9px;padding:9px 13px;font-size:13.5px;font-family:var(--sans);cursor:pointer;transition:all .18s}
  .qcm button.opt:hover{border-color:var(--ink-faint);color:var(--ink)}
  .qcm button.opt.good{border-color:var(--ok);color:var(--ok);background:rgba(127,176,105,.08)}
  .qcm button.opt.bad{border-color:var(--danger);color:var(--danger);background:rgba(208,107,90,.07)}
  .qcm .expl{font-size:12.5px;color:var(--ink-faint);margin-top:7px;display:none;line-height:1.65}
  .qcm .expl.show{display:block}

  textarea{width:100%;min-height:84px;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.6;padding:10px 12px;outline:none;resize:vertical}
  textarea:focus{border-color:var(--accent)}
  .btn{background:var(--accent);color:#1a1208;border:none;border-radius:9px;padding:9px 18px;
    font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:10px}
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);border-color:var(--ink-faint)}

  .essentiel{display:none;margin-top:12px;border:1px solid var(--accent-soft);
    background:rgba(230,160,73,.05);border-radius:10px;padding:14px 16px}
  .essentiel.show{display:block;animation:fadeIn .35s}
  .essentiel h4{font-family:var(--display);color:var(--accent);font-size:15px;margin-bottom:8px}
  .essentiel p,.essentiel li{font-size:13.5px;line-height:1.75;color:var(--ink-dim)}
  .essentiel ul{margin:6px 0 6px 18px}
  .essentiel b{color:var(--ink);font-weight:500}
  .formule{font-family:var(--mono);font-size:14px;color:var(--accent);background:var(--bg);
    border:1px solid var(--accent-soft);border-radius:8px;padding:8px 14px;display:inline-block;margin:6px 4px 2px 0}

  table.recap{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
  table.recap th{font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;
    letter-spacing:.06em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--accent-soft)}
  table.recap td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-dim);vertical-align:top}
  table.recap td:first-child{color:var(--ink)}
  table.recap .m{font-family:var(--mono);color:var(--cyan)}
  .scroll-x{overflow-x:auto}

  .score{font-family:var(--mono);font-size:15px;color:var(--accent);margin-top:12px}
  .simu-link{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#1a1208;
    border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;text-decoration:none;transition:transform .2s}
  .simu-link:hover{transform:translateY(-2px)}
  .demarche{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
  .demarche>div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .demarche .num{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
  .demarche .t{font-family:var(--display);font-size:15px;margin:5px 0 5px;color:var(--ink)}
  .demarche p{font-size:12.5px;line-height:1.6;color:var(--ink-dim)}

  footer{max-width:1100px;margin:26px auto 0;color:var(--ink-faint);font-size:11.5px;display:flex;gap:10px;flex-wrap:wrap}
  footer .dot{color:var(--accent)}
  @media (prefers-reduced-motion: reduce){.page,.essentiel.show{animation:none}}
</style>
</head>
<body>

<header>
  <h1><span class="spark">▲</span> Découvrir la mécanique des structures</h1>
  <div class="sub">Séquence inductive · Bac Pro TEBAA — je manipule, je mesure, je conclus</div>
  <div class="badge">100 % hors-ligne</div>
</header>

<nav id="nav"></nav>
<div class="progress-wrap">
  <div class="progress"><div id="progBar"></div></div>
  <div class="progress-txt" id="progTxt">0 / 7 séances</div>
</div>

<main id="main"></main>

<footer>
  <span>Séquence « Atelier Structure »</span><span class="dot">·</span>
  <span>Démarche inductive : la règle se découvre par la mesure, elle n'est donnée qu'après</span><span class="dot">·</span>
  <span>Support : atelier-structure.html</span>
</footer>

<script>
"use strict";
/* =====================================================================
   SÉQUENCE INDUCTIVE — compagnon du simulateur « Atelier Structure »
   Chaque séance : Question → Manip → Mesures (valeurs exactes du
   simulateur) → Analyse → Conclusion de l'élève → « L'essentiel »
   révélé seulement après validation des mesures.
   ===================================================================== */

const SIM = "atelier-structure.html";

const SEANCES = [
{
  id:"s1", nav:"1 · Les charges", titre:"Séance 1 — D'où viennent les charges que reçoit une poutre ?",
  question:"Deux immeubles voisins ont la même poutre. Chez l'un elle fissure, chez l'autre non. Qu'est-ce qui change ?",
  reglages:`<b>Plancher</b> Dalle BA 20 · <b>Destination</b> Logement · <b>Largeur reprise b</b> 4,0 m ·
    <b>Portée L</b> 4,00 m · <b>Poutre</b> BA 20×50 · <b>Appuis</b> 2 appuis · <b>Combinaison</b> ELS G+Q ·
    <b>Capteur R</b> Appui A · <b>Poteau</b> BA 20×20 · <b>h</b> 3,00 m · <b>Étages</b> 0 · <b>Vent</b> Nul · <b>Contreventement</b> Palée triangulée`,
  steps:[
    "Ouvre le simulateur et applique les <b>réglages de départ</b>. Repère les flèches orange au-dessus de la poutre : c'est la charge.",
    "Lis la valeur de <b>q</b> (carte « Appareils de mesure », ligne <b>Charge q</b>) et le cadran <b>Effort</b>, capteur sur l'appui A.",
    "Fais glisser la <b>largeur de reprise</b> de 4,0 m à 2,0 m. Regarde les flèches de charge et les deux valeurs.",
    "Remets b = 4,0 m puis change le <b>plancher</b> : passe de la dalle BA 20 au <b>plancher bois</b>. Note q.",
    "Ouvre la carte « Calculs en direct » : le simulateur détaille G × b, Q × b et le poids propre g₀ de la poutre."
  ],
  m:[
    ["q avec b = 4,0 m (dalle BA 20)", 32.5, 0.12, "kN/m"],
    ["R(A) avec b = 4,0 m", 65.0, 0.4, "kN"],
    ["q avec b = 2,0 m", 17.5, 0.12, "kN/m"],
    ["R(A) avec b = 2,0 m", 35.0, 0.4, "kN"],
    ["q avec b = 4,0 m et plancher bois", 16.5, 0.12, "kN/m"]
  ],
  q:{ q:"Quand tu divises la largeur de reprise par 2, la charge q ne descend pas tout à fait de moitié (32,5 → 17,5 et non 16,25). Pourquoi ?",
      opts:["Le simulateur arrondit les valeurs",
            "Le poids propre de la poutre (2,5 kN/m) ne dépend pas de la largeur reprise",
            "Parce que Q ne compte pas"],
      ok:1, expl:"q = (G + Q) × b + g₀. Seule la part venant du plancher dépend de b ; le poids propre de la poutre, lui, est toujours là." },
  consigne:"Explique avec tes mots de quoi dépend la charge q reçue par une poutre. Cite au moins trois éléments.",
  essentiel:`<h4>💡 L'essentiel — les charges et la surface d'influence</h4>
    <p>Une poutre ne reçoit pas « le poids du bâtiment » : elle reçoit la charge de la <b>bande de plancher qu'elle porte</b>.</p>
    <ul>
      <li><b>G — charges permanentes</b> (kN/m²) : tout ce qui ne bouge jamais — dalle, chape, carrelage, cloisons fixes. Dalle BA 20 cm : G = 6,0 kN/m².</li>
      <li><b>Q — charges d'exploitation</b> (kN/m²) : ce qui varie — personnes, mobilier, stockage. Fixées par l'Eurocode 1 selon la <b>destination</b> : logement 1,5 · bureaux 2,5 · salle de réunion 4,0 · commerce 5,0.</li>
      <li><b>b — largeur de reprise</b> (m), aussi appelée <b>surface d'influence</b> : la largeur de plancher qui « tombe » sur la poutre, en général la demi-portée de chaque côté.</li>
      <li><b>g₀ — poids propre</b> de la poutre elle-même (kN/m) : constant, indépendant de b.</li>
    </ul>
    <span class="formule">q = (G + Q) × b + g₀</span>
    <p>Unités : G et Q en <b>kN/m²</b> (charge surfacique), q en <b>kN/m</b> (charge linéique). 1 kN ≈ 100 kg.</p>` },

{
  id:"s2", nav:"2 · ELU / ELS", titre:"Séance 2 — Pourquoi majorer les charges ? ELU et ELS",
  question:"Sur un plan de béton armé, le calcul est fait avec « 1,35 G + 1,5 Q ». Pourquoi ne pas prendre simplement G + Q ?",
  reglages:`Mêmes réglages que la séance 1, avec <b>b = 4,0 m</b> et <b>L = 4,00 m</b> ·
    <b>Capteur M</b> Mi-travée · <b>Capteur R</b> Appui A`,
  steps:[
    "Combinaison sur <b>ELS G+Q</b> : note q et le cadran <b>Moment</b> (capteur à mi-travée).",
    "Passe sur <b>ELU 1,35G+1,5Q</b> : note les deux mêmes valeurs. Regarde grandir les flèches de charge.",
    "Passe sur <b>G seul ⚠</b> : lis l'alerte orange qui apparaît au-dessus du schéma, puis note q.",
    "Reviens sur ELS et calcule à la calculatrice le rapport <b>q(ELU) ÷ q(ELS)</b>."
  ],
  m:[
    ["q à l'ELS (G + Q)", 32.5, 0.12, "kN/m"],
    ["q à l'ELU (1,35G + 1,5Q)", 44.775, 0.12, "kN/m"],
    ["Moment à mi-travée, ELS", 65.0, 0.4, "kN·m"],
    ["Moment à mi-travée, ELU", 89.55, 0.4, "kN·m"],
    ["q avec « G seul »", 26.5, 0.12, "kN/m"],
    ["Rapport q(ELU) ÷ q(ELS)", 1.377, 0.05, "—"]
  ],
  q:{ q:"Pourquoi le coefficient sur Q (1,5) est-il plus grand que celui sur G (1,35) ?",
      opts:["Parce que Q est toujours plus lourd que G",
            "Parce que Q est bien plus incertain que G : on sait peser une dalle, pas prévoir le monde qu'il y aura dessus",
            "Parce que c'est plus simple à retenir"],
      ok:1, expl:"On majore d'autant plus qu'on connaît mal la charge. Le poids d'une dalle se calcule à 5 % près ; le nombre de personnes dans une salle, non." },
  consigne:"Rédige la différence entre ELU et ELS : à quoi sert chacun, et avec quelles charges les calcule-t-on ?",
  essentiel:`<h4>💡 L'essentiel — les combinaisons d'actions</h4>
    <p>On ne vérifie jamais une structure avec une seule charge : on utilise des <b>combinaisons</b>, avec des coefficients de sécurité partiels.</p>
    <ul>
      <li><b>ELU — État Limite Ultime</b> : le cas de la <b>ruine</b>. Sert à vérifier la <b>résistance</b> (rupture, écrasement, flambement).
        <span class="formule">ELU : 1,35 G + 1,5 Q</span></li>
      <li><b>ELS — État Limite de Service</b> : le cas de l'<b>usage normal</b>. Sert à vérifier la <b>flèche</b>, les fissures, le confort.
        <span class="formule">ELS : G + Q</span></li>
    </ul>
    <p>La charge à l'ELU est environ <b>1,4 fois</b> celle de l'ELS. Oublier Q — la combinaison « G seul » — c'est sous-estimer la charge de près de 40 % : la poutre est alors calculée pour un bâtiment vide.</p>
    <p><b>À retenir :</b> le simulateur vérifie toujours la résistance à l'ELU, quelle que soit la combinaison affichée. La réalité ne s'adapte pas à ton calcul.</p>` },

{
  id:"s3", nav:"3 · Les appuis", titre:"Séance 3 — L'équilibre : ce que les appuis renvoient",
  question:"Où partent les charges d'une poutre ? Et que change la position des appuis ?",
  reglages:`<b>Plancher</b> Plancher bois · <b>Destination</b> Logement · <b>b</b> 4,0 m · <b>Poutre</b> BA 20×40 ·
    <b>Combinaison</b> ELS · <b>Portée L</b> 3,00 m (bouton rotatif) · <b>Appuis</b> 2 appuis · <b>Capteur R</b> Appui A`,
  steps:[
    "Applique les réglages, vérifie que <b>q = 16,00 kN/m</b>, puis note R(A) et R(B) (déplace le capteur R).",
    "Calcule <b>R(A) + R(B)</b> et compare avec <b>q × L</b>. Regarde aussi les pointillés orange qui descendent vers les semelles : c'est le cheminement des charges.",
    "Passe sur <b>3 appuis</b> (un poteau au milieu) : note R(A) et R(appui central). La somme change-t-elle ?",
    "Reviens sur <b>2 appuis</b> et règle <b>L = 2,00 m</b> : note R(A).",
    "Passe en <b>Porte-à-faux ⚠</b> (toujours L = 2,00 m) : note la réaction, puis mets le capteur M sur « Sur appui » et note le moment d'encastrement."
  ],
  m:[
    ["q à l'ELS", 16.0, 0.12, "kN/m"],
    ["L = 3,00 m, 2 appuis : R(A)", 24.0, 0.4, "kN"],
    ["L = 3,00 m, 2 appuis : R(B)", 24.0, 0.4, "kN"],
    ["R(A) + R(B) (à la calculatrice)", 48.0, 0.6, "kN"],
    ["L = 3,00 m, 3 appuis : R(A)", 9.0, 0.4, "kN"],
    ["L = 3,00 m, 3 appuis : R(appui central)", 30.0, 0.4, "kN"],
    ["L = 2,00 m, 2 appuis : R(A)", 16.0, 0.4, "kN"],
    ["L = 2,00 m, porte-à-faux : R(encastrement)", 32.0, 0.4, "kN"]
  ],
  q:{ q:"Dans les trois configurations, la somme des réactions vaut toujours q × L. Pourquoi ?",
      opts:["Parce que les appuis sont identiques",
            "Parce que la structure est en équilibre : ce qui descend doit être intégralement repris",
            "C'est un hasard dû aux nombres choisis"],
      ok:1, expl:"C'est la première équation de la statique : ΣF = 0. Les appuis ne créent rien, ils renvoient exactement ce qu'ils reçoivent. Seule la répartition change." },
  consigne:"Rédige : que fait un appui ? Pourquoi l'appui central d'une poutre continue reprend-il beaucoup plus que les appuis de rive ?",
  essentiel:`<h4>💡 L'essentiel — statique et réactions d'appui</h4>
    <p>Une structure au repos est en <b>équilibre</b> : les deux équations fondamentales de la statique sont vérifiées.</p>
    <span class="formule">Σ F = 0</span><span class="formule">Σ M = 0</span>
    <ul>
      <li><b>Réaction d'appui R</b> (kN) : la force que l'appui renvoie à la poutre. Sur 2 appuis symétriques : <b>R = q L / 2</b> pour chacun.</li>
      <li><b>Poutre continue sur 3 appuis</b> : l'appui central reprend <b>10/16</b> de la charge totale (ici 30 kN sur 48), les appuis de rive <b>3/16</b> chacun. Ajouter un poteau soulage énormément la poutre… mais charge davantage la fondation centrale.</li>
      <li><b>Porte-à-faux</b> : un seul appui, qui reprend <b>toute</b> la charge (R = q L) et doit en plus encaisser un <b>moment d'encastrement</b>. C'est le schéma le plus exigeant.</li>
    </ul>

--------------------------------------------------------------------- */
let store = { steps:{}, mes:{}, qcm:{}, concl:{}, reveal:{}, bilan:{} };
function save(){
  try { localStorage.setItem("seq-structure-inductive", JSON.stringify(store)); } catch(e){}
}
(function load(){
  try {
    const raw = localStorage.getItem("seq-structure-inductive");
    if (raw) store = Object.assign(store, JSON.parse(raw));
  } catch(e){}
})();

/* ---------------------------------------------------------------------
   OUTILS
--------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, html){
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if (html != null) e.innerHTML = html;
  return e;
}
function parseNum(str){
  if (typeof str !== "string") return NaN;
  return parseFloat(str.replace(",", ".").replace(/\s/g, ""));
}
function seanceDone(s){
  return !!(store.mes[s.id] && store.mes[s.id].ok && store.reveal[s.id]);
}

    <p><i>« ${s.question} »</i></p>
    <h3>⚙ Réglages de départ sur le simulateur</h3>
    <div class="reglages">${s.reglages}</div>
    <a class="simu-link" href="${SIM}" target="_blank" rel="noopener" style="font-size:13px;padding:9px 16px">▲ Ouvrir le simulateur</a>
  `));

  const cManip = h("div", { class: "card" }, `<h3 style="margin-top:0">🔬 Je manipule</h3>
    <p>Coche chaque étape quand elle est faite.</p>`);
  const ol = h("ol", { class: "steps" });
  s.steps.forEach((t, i) => {
    const li = h("li", {}, t);
    if (store.steps[s.id] && store.steps[s.id][i]) li.classList.add("ck");
    li.addEventListener("click", () => {
      li.classList.toggle("ck");
      store.steps[s.id] = store.steps[s.id] || {};
      store.steps[s.id][i] = li.classList.contains("ck");
      save();
    });
    ol.appendChild(li);
  });
  cManip.appendChild(ol);
  p.appendChild(cManip);

  const cMes = h("div", { class: "card" }, `<h3 style="margin-top:0">📏 Je mesure</h3>
    <p>Note tes valeurs (avec une virgule, comme sur les cadrans), puis vérifie.</p>`);
  const table = h("table", { class: "mes" }, `<thead><tr><th>Mesure</th><th>Ta valeur</th></tr></thead>`);
  const tbody = h("tbody");
  const saved = (store.mes[s.id] && store.mes[s.id].vals) || {};
  s.m.forEach((row, i) => {
    const tr = h("tr");
    tr.appendChild(h("td", {}, row[0]));
    const td = h("td");
    const inp = h("input", { type: "text", inputmode: "decimal", "data-i": i, autocomplete: "off" });
    if (saved[i] != null) inp.value = saved[i];
    td.appendChild(inp);
    td.appendChild(h("span", { class: "unit" }, row[3]));
    tr.appendChild(td);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  cMes.appendChild(table);
  const btnV = h("button", { class: "btn" }, "Vérifier mes mesures");
  const res = h("div", { class: "mes-result" });
  if (store.mes[s.id] && store.mes[s.id].ok) { res.textContent = "✓ Mesures validées."; res.className = "mes-result good"; }
  btnV.addEventListener("click", () => {
    let nOk = 0;
    const vals = {};
    table.querySelectorAll("input").forEach(inp => {
      const i = +inp.dataset.i;
      const v = parseNum(inp.value);
      vals[i] = inp.value;
      const att = s.m[i][1], tol = s.m[i][2];
      const good = !isNaN(v) && Math.abs(v - att) <= tol;
      inp.classList.toggle("good", good);
      inp.classList.toggle("bad", !good);
      if (good) nOk++;
    });
    const ok = nOk === s.m.length;
    store.mes[s.id] = { ok, vals };
    save();
    res.className = "mes-result " + (ok ? "good" : "bad");
    res.textContent = ok ? "✓ Toutes les mesures sont justes !"
      : `${nOk} / ${s.m.length} mesures justes — refais les mesures en rouge sur le simulateur.`;
    refreshNav();
  });
  cMes.appendChild(btnV);
  cMes.appendChild(res);
  p.appendChild(cMes);

  const cAna = h("div", { class: "card" }, `<h3 style="margin-top:0">🤔 J'analyse</h3>`);
  const qcm = h("div", { class: "qcm" }, `<div class="q">${s.q.q}</div>`);
  const opts = h("div", { class: "opts" });
  const expl = h("div", { class: "expl" }, s.q.expl);
  s.q.opts.forEach((o, i) => {
    const b = h("button", { class: "opt" }, o);
    if (store.qcm[s.id] === i && i === s.q.ok) { b.classList.add("good"); expl.classList.add("show"); }
    b.addEventListener("click", () => {
      opts.querySelectorAll(".opt").forEach(x => x.classList.remove("good", "bad"));
      b.classList.add(i === s.q.ok ? "good" : "bad");
      if (i === s.q.ok) { expl.classList.add("show"); store.qcm[s.id] = i; save(); }
    });
    opts.appendChild(b);
  });
  qcm.appendChild(opts); qcm.appendChild(expl);
  cAna.appendChild(qcm);
  p.appendChild(cAna);

  const cCon = h("div", { class: "card" }, `<h3 style="margin-top:0">✍️ Je conclus avec mes mots</h3>
    <p>${s.consigne}</p>`);
  const ta = h("textarea", { placeholder: "Écris ta conclusion ici…" });
  if (store.concl[s.id]) ta.value = store.concl[s.id];
  ta.addEventListener("input", () => { store.concl[s.id] = ta.value; save(); });
  cCon.appendChild(ta);
  const btnR = h("button", { class: "btn ghost" }, "Comparer avec la conclusion du cours");
  const ess = h("div", { class: "essentiel" }, s.essentiel);
  btnR.addEventListener("click", () => {
    if (!(store.mes[s.id] && store.mes[s.id].ok)) {
      btnR.textContent = "Valide d'abord tes mesures 📏";
      setTimeout(() => btnR.textContent = "Comparer avec la conclusion du cours", 1800);
      return;
    }
    ess.classList.add("show");
    store.reveal[s.id] = true; save(); refreshNav();
  });
  if (store.reveal[s.id]) ess.classList.add("show");
  cCon.appendChild(btnR);
  cCon.appendChild(ess);
  p.appendChild(cCon);

  main.appendChild(p);
}

function buildBilan(){
  const p = h("section", { class: "page", id: "page-bilan" });
  p.appendChild(h("div", { class: "card" }, `
    <span class="pill amber">Bilan</span>
    <h2>Ce que tu as découvert toi-même</h2>
    <div class="scroll-x">
    <table class="recap">
      <thead><tr><th>Grandeur</th><th>Symbole</th><th>Unité</th><th>Où / comment</th><th>À retenir</th></tr></thead>
      <tbody>
        <tr><td>Charge permanente</td><td class="m">G</td><td class="m">kN/m²</td><td>Nature du plancher</td><td>Dalle BA 20 : 6,0 kN/m²</td></tr>
        <tr><td>Charge d'exploitation</td><td class="m">Q</td><td class="m">kN/m²</td><td>Destination (Eurocode 1)</td><td>Logement 1,5 · bureaux 2,5 · commerce 5,0</td></tr>
        <tr><td>Largeur de reprise</td><td class="m">b</td><td class="m">m</td><td>Surface d'influence</td><td class="m">q = (G + Q) × b + g₀</td></tr>
        <tr><td>Combinaisons</td><td class="m">ELU · ELS</td><td>—</td><td>Résistance · flèche</td><td class="m">1,35 G + 1,5 Q  ·  G + Q</td></tr>
        <tr><td>Réaction d'appui</td><td class="m">R</td><td class="m">kN</td><td>Capteur R sur les appuis</td><td class="m">Σ R = q × L  (ΣF = 0)</td></tr>
        <tr><td>Moment fléchissant</td><td class="m">M</td><td class="m">kN·m</td><td>Capteur M, mi-travée</td><td class="m">M = q L² / 8  ·  M<sub>Ed</sub> ≤ M<sub>Rd</sub> (ELU)</td></tr>
        <tr><td>Effort tranchant</td><td class="m">V</td><td class="m">kN</td><td>Diagramme V, aux appuis</td><td class="m">V = q L / 2</td></tr>
        <tr><td>Flèche</td><td class="m">f</td><td class="m">mm</td><td>Cadran Flèche (ELS)</td><td class="m">f = 5 q L⁴ / (384 EI) ≤ L/300</td></tr>
        <tr><td>Effort normal</td><td class="m">N</td><td class="m">kN</td><td>Capteur R, pied de poteau</td><td>Cumul à chaque niveau + poids propre</td></tr>
        <tr><td>Longueur de flambement</td><td class="m">L<sub>f</sub></td><td class="m">m</td><td>Liaisons du poteau</td><td class="m">h · 0,7h · 0,5h · 2h</td></tr>
        <tr><td>Charge critique</td><td class="m">N<sub>cr</sub></td><td class="m">kN</td><td>Contrôle bureau d'études</td><td class="m">N<sub>cr</sub> = π² E I / L<sub>f</sub>²</td></tr>
        <tr><td>Contreventement</td><td>—</td><td class="m">kN</td><td>Palée, voile, portique</td><td class="m">T = H d / L  ·  le triangle est indéformable</td></tr>
      </tbody>
    </table></div>
  `));

  const cQ = h("div", { class: "card" }, `<h3 style="margin-top:0">🏁 Quiz final — 8 questions</h3>`);
  const wrap = h("div");
  BILAN_QCM.forEach((q, qi) => {
    const box = h("div", { class: "qcm" }, `<div class="q">${qi + 1}. ${q.q}</div>`);
    const opts = h("div", { class: "opts" });
    q.opts.forEach((o, i) => {
      const b = h("button", { class: "opt" }, o);
      if (store.bilan[qi] === i) b.classList.add(i === q.ok ? "good" : "bad");
      b.addEventListener("click", () => {
        opts.querySelectorAll(".opt").forEach(x => x.classList.remove("good", "bad"));
        b.classList.add(i === q.ok ? "good" : "bad");
        store.bilan[qi] = i; save(); scoreLine();
      });
      opts.appendChild(b);
    });
    box.appendChild(opts);
    wrap.appendChild(box);
  });
  cQ.appendChild(wrap);
  const sc = h("div", { class: "score" });
  function scoreLine(){
    const answered = Object.keys(store.bilan).length;
    const good = BILAN_QCM.reduce((n, q, i) => n + (store.bilan[i] === q.ok ? 1 : 0), 0);
    sc.textContent = answered ? `Score : ${good} / ${BILAN_QCM.length}` + (good === BILAN_QCM.length ? " — parfait ▲" : "") : "";
  }
  scoreLine();
  cQ.appendChild(sc);
  p.appendChild(cQ);
  main.appendChild(p);
}

/* ---------------------------------------------------------------------
   NAVIGATION + PROGRESSION
--------------------------------------------------------------------- */
function show(id){
  document.querySelectorAll(".page").forEach(pg => pg.classList.toggle("on", pg.id === "page-" + id));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.page === id));
  window.scrollTo({ top: 0 });
}
function refreshNav(){
  let done = 0;
  SEANCES.forEach(s => {
    const ok = seanceDone(s);
    if (ok) done++;
    const tab = document.querySelector(`.tab[data-page="${s.id}"]`);
    if (tab) tab.classList.toggle("done", ok);
  });
  $("#progBar").style.width = (done / SEANCES.length * 100) + "%";
  $("#progTxt").textContent = `${done} / ${SEANCES.length} séances`;
}

/* ---------------------------------------------------------------------
   DÉMARRAGE
--------------------------------------------------------------------- */
buildNav();
buildHome();
SEANCES.forEach(buildSeance);
buildBilan();
refreshNav();
show("home");
</script>
