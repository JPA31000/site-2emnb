<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les styles architecturaux — cours interactif</title>
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
<meta name="description" content="Cours interactif : douze styles architecturaux, du temple grec à l’architecture bas carbone, lus par leur structure, leur matériau, leurs percements et leur décor. Frise et quiz.">
<style>
:root{
  --nuit:#16110d; --nuit2:#1e1712; --encre:#0f0b08;
  --creme:#f2e7d5; --creme2:#cdbda6;
  --ambre:#e0a458; --ambre-vif:#ffc477; --brique:#a8553a;
  --trait:#e8dcc6;
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Syne","Avenir Next","Futura","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 78% -10%, rgba(224,164,88,.16), transparent 60%),
    radial-gradient(900px 600px at 5% 105%, rgba(168,85,58,.16), transparent 62%),
    var(--nuit);
  color:var(--creme); font-family:var(--sans);
  display:flex; flex-direction:column; overflow:hidden;
}
body::after{ /* grain */
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.05; z-index:99;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>");
}

/* ---------- barre haute ---------- */
header{
  display:flex; align-items:center; gap:18px; padding:14px 26px 10px;
  border-bottom:1px solid rgba(224,164,88,.22); position:relative; z-index:5;
}
.marque{font-family:var(--serif); font-size:17px; letter-spacing:.02em; white-space:nowrap}
.marque b{color:var(--ambre)}
.frise{display:flex; gap:5px; flex:1; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.frise::-webkit-scrollbar{display:none}
.puce{
  border:1px solid rgba(242,231,213,.22); background:transparent; color:var(--creme2);
  font-family:var(--sans); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:5px 9px; border-radius:2px; cursor:pointer; white-space:nowrap; transition:.22s;
}
.puce:hover{color:var(--creme); border-color:var(--ambre)}
.puce.on{background:var(--ambre); border-color:var(--ambre); color:var(--encre); font-weight:700}
.compteur{font-family:var(--serif); font-size:15px; color:var(--creme2); white-space:nowrap}
.compteur b{color:var(--ambre); font-size:22px}
#jauge{position:absolute; left:0; bottom:-1px; height:2px; background:var(--ambre); width:0; transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* ---------- scène ---------- */
main{flex:1; overflow-y:auto; overflow-x:hidden; padding:26px 30px 96px}
.slide{max-width:1180px; margin:0 auto; animation:entree .5s ease both}
@keyframes entree{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
.periode{
  font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--ambre);
  border-left:2px solid var(--ambre); padding-left:10px; margin-bottom:10px;
}
h1{font-family:var(--serif); font-size:clamp(28px,4.4vw,50px); font-weight:600; line-height:1.03; letter-spacing:-.015em}
h1 em{color:var(--ambre); font-style:italic}
.chapo{color:var(--creme2); font-size:15.5px; line-height:1.55; max-width:62ch; margin-top:12px}

.grille{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:34px; margin-top:22px; align-items:start}
@media (max-width:900px){.grille{grid-template-columns:1fr}}

.cadre{
  background:linear-gradient(160deg,#211a14,#171109); border:1px solid rgba(224,164,88,.28);
  border-radius:3px; padding:10px; position:relative;
  box-shadow:0 26px 60px rgba(0,0,0,.5), inset 0 0 70px rgba(224,164,88,.05);
}
.cadre::before{content:""; position:absolute; inset:5px; border:1px solid rgba(242,231,213,.09); border-radius:2px; pointer-events:none}
.cadre svg{display:block; width:100%; height:auto}
.legende-croquis{font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--creme2); text-align:center; padding:6px 4px 2px}

/* croquis : traits */
.cq{fill:none; stroke:var(--trait); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; transition:stroke .25s, stroke-width .25s}
.cq.fin{stroke-width:1; stroke:rgba(232,220,198,.55)}
.cq.plein{fill:rgba(224,164,88,.07)}
.sol{stroke:var(--brique); stroke-width:2}
.hl .cq, .cq.hl{stroke:var(--ambre-vif) !important; stroke-width:3 !important; filter:drop-shadow(0 0 7px rgba(255,196,119,.75))}
g.hl .cq.plein{fill:rgba(255,196,119,.16)}

/* ---------- références / photos ---------- */
.refs{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
@media (max-width:520px){.refs{grid-template-columns:1fr}}
.ref{
  background:rgba(242,231,213,.035); border:1px solid rgba(242,231,213,.1);
  border-radius:2px; padding:8px; display:flex; flex-direction:column; gap:7px; position:relative; transition:.2s;
}
.ref.survol{border-color:var(--ambre); background:rgba(224,164,88,.12)}
.vig{
  aspect-ratio:16/10; border:1px dashed rgba(224,164,88,.35); border-radius:2px; overflow:hidden;
  display:grid; place-items:center; background:rgba(15,11,8,.5); position:relative; cursor:pointer;
}
.vig svg{width:118%; opacity:.34; filter:grayscale(1)}
.vig img{width:100%; height:100%; object-fit:cover; display:block; opacity:1; filter:none}
.vig::after{
  content:"＋ déposer une photo"; position:absolute; bottom:5px; left:0; right:0; text-align:center;
  font-size:10px; letter-spacing:.08em; color:var(--creme2); opacity:.65; pointer-events:none;
}
.vig.pleine::after{content:""}
.ref figcaption strong{display:block; font-size:13.5px; line-height:1.25}
.ref figcaption span{display:block; font-size:11.5px; color:var(--ambre); margin-top:2px}
.ref figcaption em{display:block; font-size:11.5px; color:var(--creme2); font-style:normal; opacity:.8}
.ref .credit{
  width:100%; margin-top:4px; background:transparent; border:0; border-bottom:1px solid rgba(242,231,213,.14);
  color:var(--creme2); font-family:var(--sans); font-size:10.5px; padding:2px 0; outline:none;
}
.ref .credit:focus{border-bottom-color:var(--ambre)}
.ref .credit::placeholder{color:rgba(205,189,166,.45)}

/* ---------- clés de lecture ---------- */
.titre-bloc{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--creme2); margin:2px 0 12px}
.cles{list-style:none; display:flex; flex-direction:column; gap:8px}
.cle{
  display:flex; gap:12px; align-items:flex-start; padding:11px 13px; cursor:pointer;
  background:rgba(242,231,213,.035); border:1px solid rgba(242,231,213,.09);
  border-left:2px solid rgba(224,164,88,.4); border-radius:2px; transition:.2s;
}
.cle:hover{background:rgba(224,164,88,.1); border-left-color:var(--ambre); transform:translateX(4px)}
.cle.actif{background:rgba(224,164,88,.16); border-left-color:var(--ambre-vif)}
.num{
  font-family:var(--serif); font-size:13px; color:var(--ambre); border:1px solid var(--ambre);
  width:24px; height:24px; flex:none; display:grid; place-items:center; border-radius:50%;
}
.cle strong{display:block; font-size:14.5px; letter-spacing:.01em; margin-bottom:2px}
.cle span{font-size:13px; color:var(--creme2); line-height:1.45}
.astuce{font-size:11.5px; color:var(--creme2); opacity:.7; margin-top:10px; font-style:italic}

.reperes{margin-top:20px; padding-top:16px; border-top:1px dashed rgba(224,164,88,.3)}
.tags{display:flex; flex-wrap:wrap; gap:7px}
.tag{font-size:11.5px; padding:4px 9px; border:1px solid rgba(224,164,88,.35); border-radius:999px; color:var(--creme2)}
.tag b{color:var(--ambre); font-weight:600}

/* ---------- frise récap ---------- */
.frise-slide{margin-top:20px}
.ligne{display:grid; grid-template-columns:118px 1fr; gap:14px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(242,231,213,.08)}
.ligne .an{font-family:var(--serif); color:var(--ambre); font-size:14px; text-align:right}
.barre{height:16px; border-radius:2px; background:linear-gradient(90deg,rgba(224,164,88,.85),rgba(168,85,58,.5)); position:relative}
.barre span{position:absolute; left:10px; top:-2px; font-size:11px; color:var(--encre); font-weight:700; letter-spacing:.05em; line-height:19px; white-space:nowrap}

/* ---------- quiz ---------- */
.quiz{display:flex; flex-direction:column; gap:16px; margin-top:20px; max-width:820px}
.q{background:rgba(242,231,213,.04); border:1px solid rgba(242,231,213,.1); border-radius:3px; padding:16px 18px}
.q p{font-family:var(--serif); font-size:16.5px; margin-bottom:11px}
.q p b{color:var(--ambre)}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{
  background:transparent; border:1px solid rgba(242,231,213,.22); color:var(--creme);
  font-family:var(--sans); font-size:13.5px; padding:8px 13px; border-radius:2px; cursor:pointer; transition:.18s;
}
.opt:hover:not(:disabled){border-color:var(--ambre); background:rgba(224,164,88,.12)}
.opt:disabled{cursor:default; opacity:.75}
.opt.juste{background:rgba(120,180,110,.22); border-color:#8fd18a; color:#dff5db; opacity:1}
.opt.faux{background:rgba(190,70,60,.2); border-color:#d78a80; color:#fbdcd8}
.retour{margin-top:10px; font-size:13px; color:var(--creme2); line-height:1.5; display:none}
.retour.vu{display:block; animation:entree .3s ease both}
.score{font-family:var(--serif); font-size:20px; color:var(--ambre); margin-top:6px}

/* ---------- pied ---------- */
footer{
  position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; align-items:center; gap:12px;
  padding:12px; background:linear-gradient(to top,var(--encre) 55%,transparent); z-index:6;
}
.nav{
  background:transparent; border:1px solid rgba(224,164,88,.5); color:var(--creme);
  font-family:var(--sans); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  padding:10px 20px; border-radius:2px; cursor:pointer; transition:.2s;
}
.nav:hover:not(:disabled){background:var(--ambre); color:var(--encre); border-color:var(--ambre)}
.nav:disabled{opacity:.28; cursor:default}
.clavier{font-size:11px; color:var(--creme2); opacity:.6; letter-spacing:.06em}
@media (max-width:640px){.clavier{display:none} main{padding:18px 16px 92px}}
.retour-carnet{flex:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ambre);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}.retour-carnet:hover{color:var(--creme)}
</style>
</head>
<body>

<header>

  <div class="marque">Les styles <b>architecturaux</b></div>

<main id="scene"></main>

<footer>

  <span class="clavier">flèches ← → · clique un croquis-clé pour le repérer sur le dessin</span>
  <button class="nav" id="suiv">Suivant →</button>
</footer>

  {q:"Un arc parfaitement demi-circulaire s'appelle un arc…",o:["brisé","en plein cintre","surbaissé","outrepassé"],r:1,e:"Le plein cintre est romain puis roman ; l'arc brisé est gothique."},
  {q:"À quoi sert l'arc-boutant ?",o:["Soutenir la charpente","Décorer le chevet","Reporter la poussée des voûtes vers une culée","Évacuer les eaux de toiture"],r:2,e:"Il transfère la poussée à l'extérieur, ce qui libère le mur pour le vitrail. Les gargouilles, elles, évacuent l'eau."},
  {q:"Murs très épais, baies étroites, portail en plein cintre : quel style ?",o:["Gothique","Roman","Renaissance","Art déco"],r:1,e:"La voûte en berceau pousse latéralement : il faut de la masse et peu de percements."},
  {q:"La fenêtre en bandeau est rendue possible par…",o:["Le mur porteur en pierre","La séparation structure / façade","Le double vitrage","Le toit à la Mansart"],r:1,e:"Poteaux-dalles en béton armé : la façade ne porte plus, elle peut s'ouvrir horizontalement."},
  {q:"Le « coup de fouet » caractérise…",o:["L'Art déco","Le brutalisme","L'Art nouveau","Le classicisme"],r:2,e:"Ligne courbe asymétrique en S, typique des ferronneries Art nouveau."},
  {q:"Sur un immeuble haussmannien, les balcons filants se situent aux…",o:["1ᵉʳ et 3ᵉ étages","2ᵉ et 5ᵉ étages","4ᵉ et 6ᵉ étages","Tous les étages"],r:1,e:"Règle de composition qui donne à la rue parisienne son unité horizontale."},
  {q:"Chevrons, gradins, cannelures verticales, béton armé : on est en…",o:["Art déco","Art nouveau","Néo-gothique","Renaissance"],r:0,e:"L'Art déco géométrise le décor et empile les volumes en retrait."},
  {q:"Le béton laissé brut de décoffrage est la signature du…",o:["Style international","Brutalisme","Postmodernisme","Éclectisme"],r:1,e:"Du « béton brut » vient le nom même du mouvement."}],
 tags:["Bonus : refaites la <b>frise</b> de mémoire, croquis à l'appui"]}
];

/* ============ références par style ============ */

/* ============ rendu ============ */
const scene=document.getElementById('scene'), frise=document.getElementById('frise');
let i=0, score=0, repondu=0;

S.forEach((s,n)=>{const b=document.createElement('button');b.className='puce';b.textContent=s.onglet;b.onclick=()=>aller(n);frise.appendChild(b);});
document.getElementById('tot').textContent=S.length;

function entete(s){return `<div class="periode">${s.periode}</div><h1>${s.titre}</h1><p class="chapo">${s.chapo}</p>`;}
function tags(s){return s.tags?`<div class="reperes"><div class="titre-bloc">Repères</div><div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`:'';}

function rendu(s){
  if(s.type==='frise'){
    return `<div class="slide">${entete(s)}<div class="frise-slide">${
      s.lignes.map(([a,t,w],n)=>`<div class="ligne"><div class="an">${a}</div><div class="barre" style="width:${w*6.2}%;animation:entree .5s ${n*0.05}s both"><span>${t}</span></div></div>`).join('')
    }</div>${tags(s)}</div>`;
  }
  if(s.type==='quiz'){
    return `<div class="slide">${entete(s)}<div class="quiz" id="quiz">${
      s.q.map((q,n)=>`<div class="q"><p><b>${n+1}.</b> ${q.q}</p><div class="opts">${
        q.o.map((o,j)=>`<button class="opt" data-q="${n}" data-j="${j}">${o}</button>`).join('')
      }</div><div class="retour" id="r${n}">${q.e}</div></div>`).join('')
    }<div class="score" id="score">Score : 0 / ${s.q.length}</div></div>${tags(s)}</div>`;
  }
  const vign=s.croquis.replace(/ id="k\d"/g,'').replace(/id="ru"/g,'id="ruv"').replace(/url\(#ru\)/g,'url(#ruv)');
  const R=REF[s.onglet]||[];
  const blocRef=R.length?`<div class="titre-bloc" style="margin:16px 0 8px">Deux références · dépose ta photo</div><div class="refs">${
    R.map((r,n)=>`<figure class="ref"><div class="vig" data-slot="${n}">${vign}</div>
      <figcaption><strong>${r.n}</strong><span>${r.l} · ${r.d}</span><em>${r.a}</em></figcaption>
      <input class="credit" type="text" placeholder="crédit photo / source…"></figure>`).join('')}</div>`:'';
  return `<div class="slide">${entete(s)}<div class="grille">
    <div><div class="cadre">${s.croquis}</div><div class="legende-croquis">${s.sousCroquis}</div>${blocRef}</div>
    <div><div class="titre-bloc">${s.blocTitre}</div><ul class="cles">${
      s.cles.map((c,n)=>`<li class="cle" data-k="${c.k||''}"><span class="num">${n+1}</span><div><strong>${c.t}</strong><span>${c.d}</span></div></li>`).join('')
    }</ul>${s.cles[0].k?'<div class="astuce">Clique une entrée pour la repérer sur le croquis.</div>':''}${tags(s)}</div>
  </div></div>`;
}

function aller(n){
  i=Math.max(0,Math.min(S.length-1,n));
  scene.innerHTML=rendu(S[i]); scene.scrollTop=0;
  document.getElementById('num').textContent=i+1;
  document.getElementById('jauge').style.width=((i+1)/S.length*100)+'%';
  [...frise.children].forEach((b,n2)=>b.classList.toggle('on',n2===i));
  if(frise.children[i].scrollIntoView) frise.children[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  document.getElementById('prec').disabled=(i===0);
  document.getElementById('suiv').disabled=(i===S.length-1);
  brancher();
}

const PHOTOS={}, CREDITS={};
const pick=document.createElement('input'); pick.type='file'; pick.accept='image/*'; pick.style.display='none';
document.body.appendChild(pick);
let cible=null;

function poser(slot,src){
  slot.innerHTML=`<img alt="">`; slot.querySelector('img').src=src; slot.classList.add('pleine');
  PHOTOS[i+'-'+slot.dataset.slot]=src;
}
function lire(f,slot){
  if(!f||!/^image\//.test(f.type)) return;
  const fr=new FileReader(); fr.onload=()=>poser(slot,fr.result); fr.readAsDataURL(f);
}
pick.onchange=()=>{ if(cible) lire(pick.files[0],cible); pick.value=''; };

function brancherPhotos(){
  scene.querySelectorAll('.vig').forEach(slot=>{
    const mem=PHOTOS[i+'-'+slot.dataset.slot]; if(mem) poser(slot,mem);
    slot.onclick=()=>{cible=slot; pick.click();};
    slot.ondragover=e=>{e.preventDefault(); slot.closest('.ref').classList.add('survol');};
    slot.ondragleave=()=>slot.closest('.ref').classList.remove('survol');
    slot.ondrop=e=>{e.preventDefault(); slot.closest('.ref').classList.remove('survol'); lire(e.dataTransfer.files[0],slot);};
  });
  scene.querySelectorAll('.ref .credit').forEach((c,n)=>{
    c.value=CREDITS[i+'-'+n]||'';
    c.oninput=()=>CREDITS[i+'-'+n]=c.value;
  });
}

function brancher(){
  brancherPhotos();
  scene.querySelectorAll('.cle').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.k; if(!k) return;
      const on=el.classList.contains('actif');
      scene.querySelectorAll('.cle').forEach(e=>e.classList.remove('actif'));
      scene.querySelectorAll('svg g').forEach(g=>g.classList.remove('hl'));
      if(!on){ el.classList.add('actif'); const g=scene.querySelector('#'+k); if(g) g.classList.add('hl'); }
    };
  });
  const quiz=document.getElementById('quiz'); if(!quiz) return;
  score=0; repondu=0;
  quiz.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const qn=+b.dataset.q, j=+b.dataset.j, bonne=S[i].q[qn].r;
      const grp=quiz.querySelectorAll(`.opt[data-q="${qn}"]`);
      if([...grp].some(x=>x.disabled)) return;
      grp.forEach((x,idx)=>{x.disabled=true; if(idx===bonne)x.classList.add('juste');});
      if(j!==bonne) b.classList.add('faux'); else score++;
      repondu++;
      document.getElementById('r'+qn).classList.add('vu');
      document.getElementById('score').textContent=`Score : ${score} / ${S[i].q.length}`+(repondu===S[i].q.length?(score>=7?' — œil affûté.':score>=5?' — bonne base, revoyez la frise.':' — reprenez les croquis-clés.'):'');
    };
  });
}

document.getElementById('prec').onclick=()=>aller(i-1);
document.getElementById('suiv').onclick=()=>aller(i+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){aller(i+1);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){aller(i-1);e.preventDefault();}
  if(e.key==='Home')aller(0); if(e.key==='End')aller(S.length-1);
});
let x0=null;
addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)aller(i+(d<0?1:-1));x0=null;},{passive:true});

aller(0);
</script>
</body>
</html>
